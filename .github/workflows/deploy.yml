name: Build and deploy to EC2

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker/**"
      - ".github/workflows/deploy.yml"
      - ".dockerignore"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 859734021464.dkr.ecr.us-east-1.amazonaws.com
  BACKEND_REPOSITORY: aws-file-processing-backend
  FRONTEND_REPOSITORY: aws-file-processing-frontend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Assume AWS deployment role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sign in to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set image tag
        id: image
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_REPOSITORY }}:${{ steps.image.outputs.tag }}

      - name: Build and push production frontend gateway
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64
          build-args: VITE_API_URL=
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPOSITORY }}:${{ steps.image.outputs.tag }}

      - name: Deploy images to EC2 through Systems Manager
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          set -euo pipefail
          test -n "$EC2_INSTANCE_ID"

          backend_image="$ECR_REGISTRY/$BACKEND_REPOSITORY:$IMAGE_TAG"
          frontend_image="$ECR_REGISTRY/$FRONTEND_REPOSITORY:$IMAGE_TAG"
          commands=$(jq -nc \
            --arg region "$AWS_REGION" \
            --arg registry "$ECR_REGISTRY" \
            --arg backend "$backend_image" \
            --arg frontend "$frontend_image" \
            '{commands:[
              "set -eu",
              ("aws ecr get-login-password --region " + $region + " | docker login --username AWS --password-stdin " + $registry),
              "docker network inspect aws-lab >/dev/null 2>&1 || docker network create aws-lab",
              ("docker pull " + $backend),
              ("docker pull " + $frontend),
              "docker rm -f aws-gateway aws-frontend aws-backend 2>/dev/null || true",
              ("docker run -d --name aws-backend --network aws-lab --restart unless-stopped " + $backend),
              ("docker run -d --name aws-gateway --network aws-lab --restart unless-stopped -p 80:80 " + $frontend),
              "for attempt in $(seq 1 30); do if curl -fsS http://localhost/api/v1/health; then exit 0; fi; sleep 2; done; exit 1"
            ]}')

          command_id=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${IMAGE_TAG}" \
            --parameters "$commands" \
            --query 'Command.CommandId' \
            --output text)

          attempt_number=0
          while [ "$attempt_number" -lt 60 ]; do
            attempt_number=$((attempt_number + 1))
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)

            case "$status" in
              Success)
                echo "Deployment succeeded for ${IMAGE_TAG}"
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '{Status:Status,Output:StandardErrorContent,Details:StandardOutputContent}' \
                  --output json
                exit 1
                ;;
            esac
            sleep 5
          done

          echo "Timed out waiting for EC2 deployment command ${command_id}"
          exit 1